[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdocs"
version = "0.1.0"
description = "Chat with your own documents: a small RAG assistant built on Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "google-genai",
    "pypdf>=4",
    "reportlab>=5.1.0",
    "streamlit>=1.67.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "reportlab"]

[project.scripts]
ragdocs = "ragdocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
